[project]
name = "seetapsych-attributes"
description = "SeetaPsych Attributes"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2.13.3",
]

[project.urls]
Homepage = "https://github.com/seetapsych/seetapsych-attributes"
Repository = "https://github.com/seetapsych/seetapsych-attributes"
Issues = "https://github.com/seetapsych/seetapsych-attributes/issues"

[project.optional-dependencies]
dev = [
    "jsonschema2md>=1.7.0",
    "build>=1.4.4",
    "twine>=6.2.0",
]

[dependency-groups]
dev = [
    "seetapsych-attributes[dev]",
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0.dev0"
tag-pattern = "^r(?P<version>[^-]+)$"

[tool.hatch.build.hooks.vcs]
version-file = "seetapsych_attributes/_version.py"

[build-system]
requires = ["hatchling>=1.26", "hatch-vcs>=0.4.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["seetapsych_attributes"]
