[project]
name = "seetapsych-attributes"
description = "SeetaPsych Attributes"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2.13.3",
]

[project.urls]
Homepage = "https://github.com/seetapsych/seetapsych-attributes"
Repository = "https://github.com/seetapsych/seetapsych-attributes"
Issues = "https://github.com/seetapsych/seetapsych-attributes/issues"

[project.optional-dependencies]
dev = [
    "jsonschema2md>=1.7.0",
    # build tools
    "build>=1.4.4",
    "twine>=6.2.0",
    # test tools
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
]

[dependency-groups]
dev = [
    "seetapsych-attributes[dev]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".venv",
    "dist",
    "build",
    "*.egg-info",
    "seetapsych_attributes/_version.py",
]

[tool.ruff.lint]
select = [
    "E",  # PEP 8 syntax / style errors (pycodestyle)
    "F",  # Undefined names, unused imports, logical errors (Pyflakes)
    "B",  # Common logic pitfalls (flake8-bugbear: mutable defaults, bare except, etc.)
    "I",  # Import ordering and grouping (isort)
    "ANN001",  # Missing type annotation for function argument (flake8-annotations)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = false
plugins = []
# Recommended checks (not covered by strict=false)
warn_return_any = true
no_implicit_optional = true
disallow_untyped_defs = false
ignore_missing_imports = true
warn_unused_ignores = false
disable_error_code = ["annotation-unchecked"]
exclude = [
    "seetapsych_attributes/_version.py",
    "tests/",
]

[tool.bandit]
exclude_dirs = [
    "tests",
    ".venv",
    "dist",
    "build",
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0.dev0"
tag-pattern = "^r(?P<version>[^-]+)$"

[tool.hatch.build.hooks.vcs]
version-file = "seetapsych_attributes/_version.py"

[build-system]
requires = ["hatchling>=1.26", "hatch-vcs>=0.4.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["seetapsych_attributes"]
